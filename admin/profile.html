<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Profile | NovaCart</title>

    <link rel="stylesheet" href="css/admin.css">

</head>


<body>


<div class="dashboard">



    <!-- Sidebar -->

    <aside class="sidebar">


        <div class="logo">

            <h2>NovaCart</h2>

        </div>



        <ul>


            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>



            <li>
                <a href="products.html">
                    Products
                </a>
            </li>



            <li>
                <a href="orders.html">
                    Orders
                </a>
            </li>



            <li>
                <a href="profile.html" class="active">
                    Profile
                </a>
            </li>



            <li>
                <a href="settings.html">
                    Settings
                </a>
            </li>



            <li>
                <a href="#" id="logout">
                    Logout
                </a>
            </li>


        </ul>


    </aside>





    <!-- Main Content -->

    <main class="main-content">




        <!-- Dashboard Same Topbar -->

        <header class="topbar">


            <div class="topbar-left">


                <button id="menuToggle" class="menu-btn">

                    ☰

                </button>


            </div>



            <div class="top-right">


                <span>🔔</span>

                <span>🌙</span>



                <div class="admin-profile">


                    <img
                    src="https://i.pravatar.cc/100?img=12"
                    alt="Admin">


                    <span>Aashish Gupta</span>


                </div>


            </div>


        </header>





        <h1>Admin Profile</h1>




        <div class="profile-card">



            <div class="profile-header">


                <div class="profile-avatar">

                    A

                </div>



                <h2>NovaCart Admin</h2>


                <p>Administrator Account</p>


            </div>





            <div class="profile-info">



                <div class="profile-item">

                    <span>Name</span>

                    <span>NovaCart Admin</span>

                </div>




                <div class="profile-item">

                    <span>Email</span>

                    <span>admin@novacart.com</span>

                </div>




                <div class="profile-item">

                    <span>Role</span>

                    <span>Super Admin</span>

                </div>




                <div class="profile-item">

                    <span>Account Status</span>

                    <span style="color:#10B981;font-weight:600;">

                        Active

                    </span>

                </div>



            </div>





            <div style="margin-top:30px; display:flex; gap:15px;">


                <a href="change-password.html" class="setting-btn">

                    Change Password

                </a>



                <a href="settings.html" class="setting-btn">

                    Settings

                </a>


            </div>



        </div>



    </main>



</div>




<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>

<script src="js/logout.js"></script>

<script src="js/sidebar.js"></script>


</body>

</html>
