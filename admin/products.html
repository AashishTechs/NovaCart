<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products Management | NovaCart Admin</title>

    <link rel="stylesheet" href="css/admin.css">

</head>


<body>


<div class="dashboard">



    <!-- Sidebar -->

    <aside class="sidebar">


        <div class="logo">

            <span>NovaCart</span>

        </div>



        <ul>


            <li>
                <a href="dashboard.html">
                    📊 <span>Dashboard</span>
                </a>
            </li>



            <li class="active">
                <a href="products.html">
                    📦 <span>Products</span>
                </a>
            </li>



            <li>
                <a href="orders.html">
                    🛒 <span>Orders</span>
                </a>
            </li>



            <li>
                <a href="users.html">
                    👥 <span>Users</span>
                </a>
            </li>



            <li>
                <a href="profile.html">
                    👤 <span>Profile</span>
                </a>
            </li>



            <li>
                <a href="change-password.html">
                    🔒 <span>Change Password</span>
                </a>
            </li>



            <li>
                <a href="#" id="logoutBtn">
                    🚪 <span>Logout</span>
                </a>
            </li>


        </ul>


    </aside>




    <!-- Main Content -->

    <main class="main-content">



        <!-- Same Dashboard Topbar -->

        <header class="topbar">


            <div class="topbar-left">


                <button id="menuToggle" class="menu-btn">

                    ☰

                </button>


            </div>



            <div class="top-right">


                <span>🔔</span>

                <span>🌙</span>



                <div class="admin-profile">


                    <img 
                    src="https://i.pravatar.cc/100?img=12"
                    alt="Admin">


                    <span>Aashish Gupta</span>


                </div>


            </div>


        </header>





        <div class="navbar">

            <h2>Products Management</h2>


        </div>




        <div class="content">


            <div class="page-header">



                <a href="add-product.html" class="add-btn">

                    + Add Product

                </a>




                <div class="search-box">


                    <input
                    type="text"
                    id="searchProduct"
                    placeholder="Search Product...">


                </div>


            </div>





            <div class="table-container">


                <table>


                    <thead>


                        <tr>

                            <th>ID</th>

                            <th>Image</th>

                            <th>Name</th>

                            <th>Category</th>

                            <th>Price</th>

                            <th>Stock</th>

                            <th>Action</th>

                        </tr>


                    </thead>



                    <tbody id="productTable">


                    </tbody>



                </table>


            </div>



        </div>



    </main>



</div>




<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/logout.js"></script>
<script src="js/products.js"></script>

<script src="js/sidebar.js"></script>


</body>

</html>
