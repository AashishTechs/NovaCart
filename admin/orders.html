<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders Management | NovaCart Admin</title>

    <link rel="stylesheet" href="css/admin.css">

</head>


<body>


<div class="dashboard">


    <!-- Sidebar -->

    <aside class="sidebar">


        <div class="logo">

            <h2>NovaCart</h2>

        </div>



        <ul>


            <li>
                <a href="dashboard.html">
                    📊 Dashboard
                </a>
            </li>


            <li>
                <a href="products.html">
                    📦 Products
                </a>
            </li>


            <li>
                <a href="orders.html" class="active">
                    🛒 Orders
                </a>
            </li>


            <li>
                <a href="users.html">
                    👥 Users
                </a>
            </li>


            <li>
                <a href="profile.html">
                    👤 Profile
                </a>
            </li>


            <li>
                <a href="change-password.html">
                    🔒 Change Password
                </a>
            </li>


            <li>
                <a href="#" id="logoutBtn">
                    🚪 Logout
                </a>
            </li>


        </ul>


    </aside>




    <!-- Main Content -->

    <main class="main-content">



        <!-- Dashboard Same Topbar -->

        <header class="topbar">


            <div class="topbar-left">


                <button id="menuToggle" class="menu-btn">

                    ☰

                </button>


            </div>



            <div class="top-right">


                <span>🔔</span>

                <span>🌙</span>



                <div class="admin-profile">


                    <img
                    src="https://i.pravatar.cc/100?img=12"
                    alt="Admin">


                    <span>Aashish Gupta</span>


                </div>


            </div>


        </header>





        <div class="page-header">

            <h1>Orders Management</h1>

        </div>




        <div class="search-box">


            <input
            type="text"
            id="searchOrder"
            placeholder="Search Orders...">


        </div>




        <div class="table-container">


            <table>


                <thead>


                    <tr>

                        <th>Order ID</th>

                        <th>Customer</th>

                        <th>Total</th>

                        <th>Status</th>

                        <th>Date</th>

                        <th>Action</th>

                    </tr>


                </thead>



                <tbody id="ordersTable">


                </tbody>



            </table>


        </div>



    </main>



</div>




<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/logout.js"></script>
<script src="js/orders.js"></script>

<script src="js/sidebar.js"></script>


</body>

</html>
