<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password | NovaCart Admin</title>

<link rel="stylesheet" href="./css/admin.css?v=20">

</head>


<body>


<div class="dashboard">


    <!-- Sidebar -->

    <aside class="sidebar">


        <div class="logo">

            <h2>NovaCart</h2>

        </div>



        <ul>


            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>


            <li>
                <a href="products.html">
                    Products
                </a>
            </li>


            <li>
                <a href="orders.html">
                    Orders
                </a>
            </li>


            <li>
                <a href="profile.html">
                    Profile
                </a>
            </li>


            <li>
                <a href="change-password.html" class="active">
                    Change Password
                </a>
            </li>


            <li>
                <a href="#" id="logout">
                    Logout
                </a>
            </li>


        </ul>


    </aside>





    <!-- Main Content -->

    <main class="main-content">



        <!-- Dashboard Same Topbar -->

        <header class="topbar">


            <div class="topbar-left">


                <button id="menuToggle" class="menu-btn">

                    ☰

                </button>


            </div>



            <div class="top-right">


                <span>🔔</span>

                <span>🌙</span>



                <div class="admin-profile">


                    <img
                    src="https://i.pravatar.cc/100?img=12"
                    alt="Admin">


                    <span>Aashish Gupta</span>


                </div>


            </div>


        </header>





        <div class="password-wrapper">


            <div class="password-header">


                <div class="password-icon">

                    🔐

                </div>



                <h1>
                    Change Password
                </h1>


                <p>
                    Update your admin account password securely
                </p>


            </div>





            <div class="password-card">


                <form id="change-password-form">



                    <div class="input-group">


                        <label>
                            Current Password
                        </label>



                        <input
                        type="password"
                        id="currentPassword"
                        placeholder="Enter current password"
                        required>


                    </div>





                    <div class="input-group">


                        <label>
                            New Password
                        </label>



                        <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required>


                    </div>





                    <div class="input-group">


                        <label>
                            Confirm Password
                        </label>



                        <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required>


                    </div>





                    <button type="submit">

                        Update Password

                    </button>



                </form>


            </div>


        </div>



    </main>



</div>




<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>

<script src="js/change-password.js"></script>

<script src="js/logout.js"></script>

<script src="js/sidebar.js"></script>


</body>

</html>
