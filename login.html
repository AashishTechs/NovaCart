<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NovaCart</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="config.js"></script>
    <script src="validation.js" defer></script>
</head>
<body>

<header>

    <nav>

        <div class="logo">
            <h1>NovaCart</h1>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Shop</a></li>
            <li><a href="index.html#categories">Categories</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

        <div class="nav-icons">

            <a href="wishlist.html">
                <i class="fa-regular fa-heart"></i> Wishlist
            </a>

            <a href="cart.html" class="cart-link">
                <i class="fa-solid fa-cart-shopping"></i>
                Cart
                <span class="cart-count" id="navCartCount">0</span>
            </a>

            <a href="login.html" class="active">
                <i class="fa-regular fa-user"></i>
                Login
            </a>

        </div>

        <button class="menu-toggle" aria-label="Toggle menu">
            <i class="fa-solid fa-bars"></i>
        </button>

    </nav>

</header>

<main>

<section class="login">

    <div class="login-box">

        <h1>Welcome Back</h1>

        <p>Login to continue shopping with NovaCart.</p>

        <form>

            <input
                type="email"
                name="email"
                placeholder="Enter your Email"
                required
            >

            <div class="pass-field">

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your Password"
                    required
                >
                <i class="fa-regular fa-eye pass-toggle"></i>
                    
    </button>

            </div>

            <label class="remember-row">

                <input
                    type="checkbox"
                    name="remember"
                >

                Remember me

            </label>

            <button type="submit">
                Login
            </button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</section>

</main>

<footer>

    <p>&copy; 2026 NovaCart. All Rights Reserved.</p>

</footer>

<script src="script.js"></script>
<script src="login.js"></script>

</body>
</html>
